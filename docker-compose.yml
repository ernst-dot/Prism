version: '3.9'

services:
  # ── React frontend (Vite dev server) ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - prism-net

  # ── PHP backend (Apache + PHP 8.2) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DB=prism
      - MYSQL_USER=prism
      - MYSQL_PASS=prism_secret
      - MONGO_URI=mongodb://mongo:27017/prism
      - JWT_SECRET=change_this_in_production_please
      - APP_ENV=development
    depends_on:
      - mysql
      - mongo
    networks:
      - prism-net

  # ── MySQL 8 ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: prism
      MYSQL_USER: prism
      MYSQL_PASSWORD: prism_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - prism-net

  # ── MongoDB 7 ─────────────────────────────────────────
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - prism-net

  # ── Redis (sessions + caching) ────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - prism-net

volumes:
  mysql_data:
  mongo_data:

networks:
  prism-net:
    driver: bridge
